on:
  workflow_call:
    outputs:
      asset_alias_name:
        value: ${{ jobs.build.outputs.asset_alias_name }}
      asset_path:
        value: ${{ jobs.build.outputs.asset_path }}
      new_tag:
        value: ${{ jobs.build.outputs.new_tag }}
      tag:
        value: ${{ jobs.build.outputs.tag }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ vars.RUNNER != '' && fromJSON(vars.RUNNER) || 'ubuntu-latest' }}

    outputs:
      asset_alias_name: ${{ steps.get_asset.outputs.asset_alias_name }}
      asset_path: ${{ steps.get_asset.outputs.asset_path }}
      new_tag: ${{ steps.get_vars.outputs.new_tag }}
      tag: ${{ steps.get_vars.outputs.tag }}

    steps:
    - uses: actions/checkout@v6

    - name: Ensure clean dist
      run: rm -rf dist

    - name: Vendor and test
      run: |
        make vendor
        make test

    - name: Get variables
      id: get_vars
      run: |
        tag=v$(sed -n 's/^__version__ = "\(.*\)"/\1/p' adoc_gui/__init__.py)
        git fetch --tags --prune --prune-tags --force
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        if [ "${{ github.ref }}" == "refs/heads/gui" ]; then
          if ! [ $(git tag -l "gui/$tag") ] ; then
            echo "new_tag=true" >> "$GITHUB_OUTPUT"
            echo "new_tag=true" >> "$GITHUB_ENV"
          fi
        fi

    - name: Create dirty version with git sha
      if: ${{ env.new_tag != 'true' }}
      run: >
        sha=$(echo $GITHUB_SHA | cut -c 1-12) ;
        sed -i "s/^__version__ = \"\([^\"]*\)\"/__version__ = \"\1+git.$sha\"/" \
          adoc_gui/__init__.py

    - name: Build a binary wheel and a source tarball
      run: |
        python3 -m venv venv/3/build-package
        source ./venv/3/build-package/bin/activate
        python3 -m ensurepip
        pip3 install build
        python3 -m build

    - name: Check the vendored files are in the wheel
      run: |
        python3 -m zipfile -l dist/*.whl | grep -q 'adoc_gui/web/vendor/tree-sitter-rst.wasm'
        python3 -m zipfile -l dist/*.whl | grep -q 'adoc_gui/web/vendor/codemirror.js'

    - name: Get asset name
      id: get_asset
      run: |
        asset_alias_name=$(sed -n 's/^name = "//p' pyproject.toml | sed 's/"$//' | head -n 1)
        echo "asset_alias_name=$asset_alias_name.tar.gz" >> "$GITHUB_OUTPUT"
        asset_path=$(find dist/ -maxdepth 1 -name "*.tar.gz" -print -quit)
        echo "asset_path=$asset_path" >> "$GITHUB_OUTPUT"

    - uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
