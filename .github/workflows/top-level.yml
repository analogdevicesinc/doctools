on:
  push:
    branches:
      - gui
      - gui/*
  pull_request:

jobs:
  build:
    uses: ./.github/workflows/build-package.yml
    permissions:
      contents: read

  deploy:
    uses: ./.github/workflows/deploy-package.yml
    needs: [build]
    secrets:
      PYPI_API_KEY: ${{ secrets.PYPI_API_KEY }}
    permissions:
      contents: write
    with:
      asset_alias_name: ${{ needs.build.outputs.asset_alias_name }}
      asset_path: ${{ needs.build.outputs.asset_path }}
      new_tag: ${{ needs.build.outputs.new_tag }}
      tag: ${{ needs.build.outputs.tag }}
