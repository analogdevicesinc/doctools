name: GH Pages Deploy
description: Deploy to gh-pages

inputs:
  gh-token:
    description: "GitHub Token"
    default: ${{ github.token }}
  new_tag:
    description: "If is a new tag"
    default: false
  path:
    description: "Path to host docs"
    default: "."
  tag:
    description: "Tag value"
    default: ""
  branch:
    description: "Branch to manage"
    default: gh-pages
  name:
    description: "Artifact to deploy"
    required: true

# behaviour:
# on push:
#  * adds doc to root ./
#  * if is a new tag, add to ./<tag> as well
# on pull_request:
#  * adds to ./pull/<id>
#
# Important:
#   if the workflow runs in other branches,
#   do not run this workflow!

runs:
  using: composite
  steps:
    - name: Check run condition
      id: check
      shell: bash
      run: |
        # Check run condition
        run=""
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          if [[ "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]]; then
            run="true"
          fi
        elif [[ "${{ github.event_name }}" == "push" ]]; then
          run="true"
        fi
        echo "run=$run" >> "$GITHUB_OUTPUT"

    - uses: analogdevicesinc/doctools/blank@action
      if: ${{ steps.check.outputs.run == 'true' }}

    - name: Context to path
      id: context
      if: ${{ steps.check.outputs.run == 'true' }}
      shell: bash
      run: |
        # Context to path
        base_path='${{ inputs.path }}'
        base_path="${base_path%/}"
        base_path="${base_path#./}"
        [[ -n "$base_path" ]] || base_path='.'

        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          echo "doc_tag_path=${base_path}/pull/${{ github.event.number }}" >> "$GITHUB_OUTPUT"
        elif [[ "${{ inputs.new_tag }}" == "true" ]] && [[ -n "${{ inputs.tag }}" ]]; then
          echo "doc_tag_path=${base_path}/${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
        fi
        echo "doc_path=${base_path}" >> "$GITHUB_OUTPUT"

    - name: Prepare gh-pages branch
      if: ${{ steps.check.outputs.run == 'true' }}
      shell: bash
      env:
        branch: ${{ inputs.branch }}
        doc_path: ${{ steps.context.outputs.doc_path }}
        doc_tag_path: ${{ steps.context.outputs.doc_tag_path }}
      run: |
        # Prepare gh-pages branch
        [[ "${{ runner.debug }}" == "1" ]] && set -x
        git ls-remote --exit-code --heads origin "refs/heads/$branch" && (
          git fetch origin "$branch:$branch" --depth 1 -f
          git switch "$branch"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            built_docs=$(find "$doc_path" -mindepth 2 -name objects.inv -exec sh -c 'dirname {}' ';' 2>/dev/null)
            git rm -r "$doc_path" --quiet || true
            if [[ -n "$built_docs" ]]; then
              git checkout @ -- $built_docs
            fi
          fi
          if [[ -n "$doc_tag_path" ]]; then
            git rm -r "$doc_tag_path" --quiet || true
          fi
        ) || (
          git checkout --orphan "$branch"
          git reset --hard
          git commit -m "initial commit" --allow-empty
        )

    - uses: actions/download-artifact@v8
      if: ${{ steps.check.outputs.run == 'true' && github.event_name == 'push' }}
      with:
        name: ${{ inputs.name }}
        path: ${{ steps.context.outputs.doc_path }}

    - uses: actions/download-artifact@v8
      if: ${{ steps.check.outputs.run == 'true' && steps.context.outputs.doc_tag_path != '' }}
      with:
        name: ${{ inputs.name }}
        path: ${{ steps.context.outputs.doc_tag_path }}

    - name: Generate sitemap
      if: ${{ steps.check.outputs.run == 'true' }}
      shell: bash
      run: |
        # Generate sitemap
        [[ "${{ runner.debug }}" == "1" ]] && set -x

        baseurl="https://$(echo ${{ github.repository }} | sed 's#/#.github.io/#')"
        today=$(date -u +%F)

        git add -A

        # Don't index some
        skip() {
          case "$1" in
            pull/*|*/pull/*) return 0 ;;
            genindex.html|search.html|_toctree.html) return 0 ;;
            */genindex.html|*/search.html|*/_toctree.html) return 0 ;;
          esac
          return 1
        }

        declare -A lastmod=()
        while IFS='|' read -r loc modified; do
          lastmod["/$loc"]="$modified"
        done < <(git show HEAD:sitemap.xml 2>/dev/null |
                 sed 's#</url>#</url>\n#g' |
                 sed -n "s#^.*<loc>${baseurl}/\([^<]*\)</loc><lastmod>\([^<]*\)</lastmod>.*#\1|\2#p")

        declare -A changed=()
        while IFS= read -r -d '' rel; do
          changed["/$rel"]=1
        done < <(git diff --cached --name-only -z --diff-filter=ACMRT HEAD -- '*.html')

        {
          echo "<?xml version='1.0' encoding='utf-8'?>"
          echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
          while IFS= read -r -d '' rel; do
            skip "$rel" && continue
            loc=$rel
            [[ "$rel" == index.html || "$rel" == */index.html ]] && loc=${rel%index.html}
            modified=$today
            [[ -n "${changed["/$rel"]:-}" ]] || modified=${lastmod["/$loc"]:-$today}
            printf '<url><loc>%s/%s</loc><lastmod>%s</lastmod></url>\n' \
              "$baseurl" "$loc" "$modified"
          done < <(git ls-files -z --cached -- '*.html' | sort -z)
          echo '</urlset>'
        } > sitemap.xml

    - name: Generate aux files
      if: ${{ steps.check.outputs.run == 'true' }}
      shell: bash
      run: |
        # Generate aux files
        touch .nojekyll
        find . -name objects.inv -exec sh -c 'dirname {}' ';' |
          cut -c 3- | sort -Vr |
          jq --raw-input . |
          jq --slurp . > tags.json

    - name: Commit and push to gh-pages
      if: ${{ steps.check.outputs.run == 'true' }}
      shell: bash
      run: |
        # Commit and push to gh-pages
        [[ "${{ runner.debug }}" == "1" ]] && set -x
        git add . >> /dev/null
        if git diff --cached --quiet ; then
          echo "::notice ::No changes, nothing to commit"
          exit 0
        fi
        context=""
        msg=""
        action="${{ github.event.action }}"
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          context=" #${{ github.event.number }}"
          owner=$(echo ${{ github.repository }} | cut -d/ -f1)
          repo=$(echo ${{ github.repository }} | cut -d/ -f2)
          msg="${msg}https://$owner.github.io/$repo/pull/${{ github.event.number }}"$'\n'
        fi
        [[ -n "$action" ]] && context="$context ($action)"
        git commit -m "deploy: ${GITHUB_SHA}$context" -m "$msg" --allow-empty
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          response=$(curl -s -L -w '\n%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ inputs.gh-token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}")
          http_code=$(echo "$response" | tail -n1)
          json=$(echo "$response" | sed '$d')
          state=$(echo "$json" | jq -r '.state')
          if [[ "$http_code" == "403" ]]; then
            echo "::note ::Got 403 for pull request state (token is missing the 'pull-requests: read' permission and private repo?), using context."
            state="${{ github.event.pull_request.state }}"
          fi
          if [[ "$state" == "open" ]]; then
            git push origin ${{ inputs.branch }}:${{ inputs.branch }}
          else
            echo "::warning ::PR state '$state' is not 'open', not pushing"
          fi
        else
          git push origin ${{ inputs.branch }}:${{ inputs.branch }}
        fi

