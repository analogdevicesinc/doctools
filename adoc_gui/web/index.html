<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Doctools</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // The theme chosen, else the one of the system, as the Doctools theme does
    (() => {
      let chosen = null
      try { chosen = localStorage.getItem('theme') } catch { }
      const system = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      document.documentElement.classList.toggle('dark', (chosen ?? system) === 'dark')
    })()
  </script>
</head>
<body>
  <header class="app-bar">
    <div class="titles">
      <h1 id="title">Doctools</h1>
      <span id="file"></span>
    </div>
    <button class="build-button" id="toggle-docs" type="button" title="Build the documentation" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      <span id="docs-label">Build</span>
    </button>
    <button class="icon-button" id="toggle-inspect" type="button" title="Show the structure" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 8h-2.81c-.45-.78-1.07-1.45-1.82-1.96L17 4.41 15.59 3l-2.17 2.17C12.96 5.06 12.49 5 12 5c-.49 0-.96.06-1.41.17L8.41 3 7 4.41l1.62 1.63C7.88 6.55 7.26 7.22 6.81 8H4v2h2.09c-.05.33-.09.66-.09 1v1H4v2h2v1c0 .34.04.67.09 1H4v2h2.81c1.04 1.79 2.97 3 5.19 3s4.15-1.21 5.19-3H20v-2h-2.09c.05-.33.09-.66.09-1v-1h2v-2h-2v-1c0-.34-.04-.67-.09-1H20V8zm-6 8h-4v-2h4v2zm0-4h-4v-2h4v2z"/></svg>
    </button>
    <button class="icon-button" id="toggle-theme" type="button" title="Switch theme">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 0 0 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
    </button>
  </header>

  <div class="toolbar" role="toolbar" aria-label="Format">
    <label class="grammar" title="Check the spelling and the grammar with LanguageTool">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.45 16h2.09L9.43 3H7.57L2.46 16h2.09l1.12-3h5.64l1.14 3zm-6.02-5L8.5 5.48 10.57 11H6.43zm15.16.59l-8.09 8.09L9.83 16l-1.41 1.41 5.09 5.09L23 13l-1.41-1.41z"/></svg>
      <select id="grammar" aria-label="Grammar">
        <option value="local">Local</option>
        <option value="cloud">Cloud</option>
        <option value="off">Off</option>
      </select>
    </label>
    <span class="divider" aria-hidden="true"></span>
    <button class="icon-button" data-action="undo" type="button" title="Undo (Ctrl+Z)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
    </button>
    <button class="icon-button" data-action="redo" type="button" title="Redo (Ctrl+Y)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg>
    </button>
    <span class="divider" aria-hidden="true"></span>
    <button class="icon-button" data-action="bold" type="button" title="Bold (Ctrl+B)" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.6 10.79c.97-.67 1.65-1.77 1.65-2.79 0-2.26-1.75-4-4-4H7v14h7.04c2.09 0 3.71-1.7 3.71-3.79 0-1.52-.86-2.82-2.15-3.42zM10 6.5h3c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5h-3v-3zm3.5 9H10v-3h3.5c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5z"/></svg>
    </button>
    <button class="icon-button" data-action="italic" type="button" title="Italic (Ctrl+I)" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4v3h2.21l-3.42 8H6v3h8v-3h-2.21l3.42-8H18V4z"/></svg>
    </button>
    <button class="icon-button" data-action="code" type="button" title="Literal (Ctrl+E)" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
    </button>
  </div>

  <main>
    <div class="side left">
      <button class="icon-button open-panel" id="open-nav" type="button" title="Show the files">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
      </button>
      <nav class="drawer panel" aria-label="Files">
      <div class="drawer-head">
        <span id="sparse-state">Files</span>
        <button class="text-button" id="sparse-clear" type="button" hidden>Build all</button>
        <button class="icon-button close-panel" id="close-nav" type="button" title="Hide the files"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
      </div>
      <div id="tree" role="tree"></div>
    </nav>
    </div>
    <div class="canvas">
      <article id="view" class="page" contenteditable="true" spellcheck="false"></article>
    </div>
    <div class="side right">
      <button class="icon-button open-panel" id="open-source" type="button" title="Show the source and the live view">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.4 16.6 4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0 4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
      </button>
      <aside class="sheet panel" id="source-pane" aria-label="Side pane">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="source" type="button" aria-selected="true">Source</button>
        <button class="tab" role="tab" data-tab="preview" type="button" aria-selected="false" hidden>Live view</button>
        <button class="tab" role="tab" data-tab="changes" type="button" aria-selected="false" hidden>Changes</button>
        <button class="icon-button close-panel" id="close-source" type="button" title="Hide the side pane"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
      </div>
      <div id="source" role="tabpanel">
      </div>
      <div id="changes" role="tabpanel" hidden>
      <form id="commit-box" class="commit-box">
        <label for="commit-subject" id="commit-title">Commit</label>
        <div class="commit-subject">
          <input id="commit-subject" type="text" spellcheck="true" autocomplete="off" placeholder="Summary: what changed">
          <span id="commit-count" title="Keep the summary short: 50 characters, at most 72"></span>
        </div>
        <textarea id="commit-message" rows="4" spellcheck="true" placeholder="Why, and how (optional)"></textarea>
        <div class="commit-actions">
          <label class="commit-signoff" title="Add a Signed-off-by line (git commit -s)"><input id="commit-signoff" type="checkbox"> Sign off</label>
          <span id="commit-problem"></span>
          <button class="build-button" id="commit-do" type="submit">Commit</button>
        </div>
      </form>
        <div id="changes-list"></div>
      </div>
      <div id="preview" role="tabpanel" hidden>
        <iframe id="frame" title="Live view" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
        <div id="preview-empty">
          <p id="preview-text"></p>
          <button class="text-button" id="preview-start" type="button">Build the documentation</button>
        </div>
      </div>
    </aside>
    </div>
  </main>
  <footer id="status"></footer>
  <div id="menu" class="menu" role="listbox" hidden></div>
  <div id="context" class="context-menu" role="menu" hidden></div>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
