name: GH Upload Pages Artifact

description: Upload github-pages artifact

inputs:
  path:
    description: "Built documentation path"
    default: "."
  new_tag:
    description: "If is a new tag"
    default: false
  tag:
    description: "Tag value"
    default: ""
  token:
    description: "GitHub Token"
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Check run condition
      shell: bash
      run: |
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          if [[ "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]]; then
            echo "gh_pages_deploy_run=true" >> "$GITHUB_ENV"
          else
            echo "gh_pages_deploy_run=" >> "$GITHUB_ENV"
          fi
        elif [[ "${{ github.event_name }}" == "push" ]]; then
          echo "gh_pages_deploy_run=true" >> "$GITHUB_ENV"
        else
          echo "gh_pages_deploy_run=" >> "$GITHUB_ENV"
        fi

    - name: Context to path
      if: ${{ env.gh_pages_deploy_run == 'true' }}
      shell: bash
      run: |
        # Context to path
        base_path='${{ inputs.path }}'
        base_path="${base_path%/}"
        base_path="${base_path#./}"
        [[ -n "$base_path" ]] || base_path='.'

        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          echo "doc_tag_path=pull/${{ github.event.number }}" >> "$GITHUB_ENV"
        elif [[ "${{ inputs.new_tag }}" == "true" ]] && [[ -n "${{ inputs.tag }}" ]]; then
          echo "doc_tag_path=${{ inputs.tag }}" >> "$GITHUB_ENV"
        fi
        echo "doc_path=${base_path}" >> "$GITHUB_ENV"

    - name: Sanity
      if: ${{ env.gh_pages_deploy_run == 'true' }}
      shell: bash
      run: |
        # Sanity
        which zip || { "::error:: 'zip' is required"; exit 1;}
        which tar || { "::error:: 'tar' is required"; exit 1;}
        which git-lfs || { "::error:: 'git-lfs' is required"; exit 1;}

    - name: Acquire deploy lock
      if: ${{ env.gh_pages_deploy_run == 'true' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        # Acquire deploy lock
        [[ "${{ runner.debug }}" == "1" ]] && set -x

        owner_repo="${{ github.repository }}"
        sha=${{ github.sha }}
        lock_name="gh-pages"
        ref="refs/locks/$lock_name"

        echo "With lock '$ref'"
        while true; do
          resp=$(curl -sSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$owner_repo/git/refs" \
            -d "{\"ref\":\"$ref\",\"sha\":\"$sha\"}")
          status=$(echo "$resp" | jq -r '.status // empty')
          message=$(echo "$resp" | jq -r '.message // empty')
          if [[ "$status" = "401" ]] || [[ "$status" = "403" ]]; then
            echo "$message"; exit 1
          elif [ "$status" = "422" ]; then
            echo "Waiting other deploy to finish..."
            sleep 5
          elif echo "$resp" | jq -e '.ref'; then
            break
          else
            echo "$resp"; exit 1
          fi
        done
        echo "deploy_lock_acquired=true" >> "$GITHUB_ENV"

    - name: Download github-pages artifact
      if: ${{ env.deploy_lock_acquired == 'true' }}
      shell: bash
      run: |
        [[ "${{ runner.debug }}" == "1" ]] && set -x
        _site=$(mktemp -d -t gh-pages.XXX)
        echo "_site=$_site" >> "$GITHUB_ENV"
        _worktree=$(mktemp -d -t gh-pages-archive.XXX)
        echo "_worktree=$_worktree" >> "$GITHUB_ENV"
        git fetch origin gh-pages-archive && {
          git worktree add "$_worktree" origin/gh-pages-archive
          cd "$_worktree"
          git lfs pull --include="github-pages.zip"
          if [[ -f github-pages.zip ]]; then
            unzip -o github-pages.zip artifact.tar
            tar -xf artifact.tar -C "$_site"
            rm -f artifact.tar
          fi
          cd -
        } || git worktree add --orphan -b gh-pages-archive "$_worktree"

    - name: Merge built docs into site
      if: ${{ env.deploy_lock_acquired == 'true' }}
      shell: bash
      run: |
        # Merge built docs into site
        [[ "${{ runner.debug }}" == "1" ]] && set -x
        doc_path=$(realpath "${{ env.doc_path }}")
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          rm -rf "$_site/${{ env.doc_tag_path }}"
          mkdir -p "$_site/${{ env.doc_tag_path }}"
          cp -af "$doc_path/." "$_site/${{ env.doc_tag_path }}/"
        elif [[ "${{ inputs.new_tag }}" == "true" && -n "${{ inputs.tag }}" ]]; then
          pushd "$_site"
          roots=$(find . -type f -name objects.inv -exec dirname {} \; | sed 's|^\./||' | sort -u)
          for entry in *; do
            keep=0
            for r in $roots; do
              [ "$entry" = "$r" ] && keep=1 && break
            done
            [ $keep -eq 0 ] && rm -rf "$entry"
          done
          popd
          cp -af "$doc_path/." "$_site/"
          rm -rf "$_site/${{ env.doc_tag_path }}"
          mkdir -p "$_site/${{ env.doc_tag_path }}"
          cp -af "$doc_path/." "$_site/${{ env.doc_tag_path }}/"
        elif [[ "${{ github.event_name }}" == "push" ]]; then
          pushd "$_site"
          roots=$(find . -type f -name objects.inv -exec dirname {} \; | sed 's|^\./||' | sort -u)
          for entry in *; do
            keep=0
            for r in $roots; do
              [ "$entry" = "$r" ] && keep=1 && break
            done
            [ $keep -eq 0 ] && rm -rf "$entry"
          done
          popd
          cp -af "$doc_path/." "$_site/"
        fi

    - name: Generate aux files
      if: ${{ env.deploy_lock_acquired == 'true' }}
      shell: bash
      run: >
        cd "$_site" ;
        touch .nojekyll ;
        find . -name objects.inv -exec sh -c 'dirname {}' ';' |
        cut -c 3- | sort -Vr |
        jq --raw-input . |
        jq --slurp . > tags.json

        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          echo 'LAST_DEPLOY="./${{ env.doc_tag_path }}"' > "$_site/context.txt"
        elif [[ "${{ inputs.new_tag }}" == "true" && -n "${{ inputs.tag }}" ]]; then
          echo 'LAST_DEPLOY=". ./${{ env.doc_tag_path }}"' > "$_site/context.txt"
        else
          echo 'LAST_DEPLOY="."' > "$_site/context.txt"
        fi

    - name: Pack artifact
      if: ${{ env.deploy_lock_acquired == 'true' }}
      shell: bash
      run: |
        # Pack artifact
        [[ "${{ runner.debug }}" == "1" ]] && set -x
        rm -f github-pages
        tar -cf "$_worktree/artifact.tar" -C "$_site" .

        pushd "$_worktree"
        git lfs install --local
        printf 'github-pages.zip filter=lfs diff=lfs merge=lfs -text\n' > .gitattributes
        git add .gitattributes
        rm -f github-pages.zip
        zip github-pages.zip artifact.tar
        rm -f artifact.tar
        git add github-pages.zip
        context=""
        msg=""
        action="${{ github.event.action }}"
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          context=" #${{ github.event.number }}"
          owner=$(echo ${{ github.repository }} | cut -d/ -f1)
          repo=$(echo ${{ github.repository }} | cut -d/ -f2)
          msg="${msg}https://$owner.github.io/$repo/pull/${{ github.event.number }}"$'\n'
        fi
        [[ -n "$action" ]] && context="$context ($action)"
        git commit -m "deploy: ${GITHUB_SHA}$context" -m "$msg" --allow-empty
        git push origin HEAD:gh-pages-archive

        popd
        cp "$_worktree/github-pages.zip" github-pages

        git worktree remove "$_worktree" --force || :
        git worktree prune || :

    - name: Release deploy lock
      if: ${{ env.deploy_lock_acquired == 'true' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        # Release deploy lock
        owner_repo="${{ github.repository }}"
        lock_name="gh-pages"
        ref="refs/locks/$lock_name"
        resp=$(curl -sSL -w '\n%{http_code}' -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$owner_repo/git/$ref")
        code=$(echo "$resp" | tail -n1)
        [[ "$code" == 204 ]] || { echo "::error:: Failed to release lock: $resp"; exit 1 ;}

    - uses: actions/upload-artifact@v7
      if: ${{ env.deploy_lock_acquired == 'true' }}
      with:
        path: github-pages
        archive: false
