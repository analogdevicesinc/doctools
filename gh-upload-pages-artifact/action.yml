name: GH Upload Pages Artifact

description: Upload github-pages artifact

inputs:
  path:
    description: "Built documentation path"
    default: "."
  new_tag:
    description: "If is a new tag"
    default: false
  tag:
    description: "Tag value"
    default: ""
  token:
    description: "GitHub Token"
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Check run condition
      id: check
      shell: bash
      run: |
        # Check run condition
        run=""
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          if [[ "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]]; then
            run="true"
          fi
        elif [[ "${{ github.event_name }}" == "push" ]]; then
          run="true"
        fi
        echo "run=$run" >> "$GITHUB_OUTPUT"

    - name: Context to path
      id: context
      if: ${{ steps.check.outputs.run == 'true' }}
      shell: bash
      run: |
        # Context to path
        base_path='${{ inputs.path }}'
        base_path="${base_path%/}"
        base_path="${base_path#./}"
        [[ -n "$base_path" ]] || base_path='.'

        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          echo "doc_tag_path=pull/${{ github.event.number }}" >> "$GITHUB_OUTPUT"
        elif [[ "${{ inputs.new_tag }}" == "true" ]] && [[ -n "${{ inputs.tag }}" ]]; then
          echo "doc_tag_path=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
        fi
        echo "doc_path=${base_path}" >> "$GITHUB_OUTPUT"

    - name: Sanity
      if: ${{ steps.check.outputs.run == 'true' }}
      shell: bash
      run: |
        # Sanity
        which zip || { "::error:: 'zip' is required"; exit 1;}
        which tar || { "::error:: 'tar' is required"; exit 1;}
        which git-lfs || { "::error:: 'git-lfs' is required"; exit 1;}

    - name: Acquire deploy lock
      id: lock
      if: ${{ steps.check.outputs.run == 'true' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        # Acquire deploy lock
        [[ "${{ runner.debug }}" == "1" ]] && set -x

        owner_repo="${{ github.repository }}"
        sha=${{ github.sha }}
        lock_name="gh-pages"
        ref="refs/locks/$lock_name"

        echo "With lock '$ref'"
        while true; do
          resp=$(curl -sSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$owner_repo/git/refs" \
            -d "{\"ref\":\"$ref\",\"sha\":\"$sha\"}")
          status=$(echo "$resp" | jq -r '.status // empty')
          message=$(echo "$resp" | jq -r '.message // empty')
          if [[ "$status" = "401" ]] || [[ "$status" = "403" ]]; then
            echo "$message"; exit 1
          elif [ "$status" = "422" ]; then
            echo "Waiting other deploy to finish..."
            sleep 5
          elif echo "$resp" | jq -e '.ref'; then
            break
          else
            echo "$resp"; exit 1
          fi
        done
        echo "acquired=true" >> "$GITHUB_OUTPUT"

    - name: Download github-pages artifact
      id: download
      if: ${{ steps.lock.outputs.acquired == 'true' }}
      shell: bash
      run: |
        # Download github-pages artifact
        [[ "${{ runner.debug }}" == "1" ]] && set -x
        _site=$(mktemp -d -t gh-pages.XXX)
        _site_old="$_site.old"
        mkdir -p "$_site_old"
        _worktree=$(mktemp -d -t gh-pages-archive.XXX)
        {
          echo "site=$_site"
          echo "site_old=$_site_old"
          echo "worktree=$_worktree"
        } >> "$GITHUB_OUTPUT"
        git fetch origin gh-pages-archive && {
          git worktree add "$_worktree" origin/gh-pages-archive
          cd "$_worktree"
          git lfs pull --include="github-pages.zip"
          if [[ -f github-pages.zip ]]; then
            unzip -o github-pages.zip artifact.tar
            tar -xf artifact.tar -C "$_site"
            cp -af "$_site/." "$_site_old/"
            rm -f artifact.tar
          fi
          cd -
        } || git worktree add --orphan -b gh-pages-archive "$_worktree"

    - name: Merge built docs into site
      if: ${{ steps.lock.outputs.acquired == 'true' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        site: ${{ steps.download.outputs.site }}
        doc_path: ${{ steps.context.outputs.doc_path }}
        doc_tag_path: ${{ steps.context.outputs.doc_tag_path }}
      run: |
        # Merge built docs into site

        [[ "${{ runner.debug }}" == "1" ]] && set -x
        doc_path=$(realpath "$doc_path")
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          rm -rf "$site/$doc_tag_path"
          mkdir -p "$site/$doc_tag_path"
          cp -af "$doc_path/." "$site/$doc_tag_path/"
        elif [[ "${{ inputs.new_tag }}" == "true" && -n "${{ inputs.tag }}" ]]; then
          pushd "$site"
          roots=$(find . -mindepth 2 -type f -name objects.inv -exec dirname {} \; | cut -d/ -f2 | sort -u)
          for entry in * .[^.]* ..?*; do
            [ -e "$entry" ] || continue
            keep=0
            for r in $roots; do
              [ "$entry" = "$r" ] && keep=1 && break
            done
            [ $keep -eq 0 ] && rm -rf "$entry"
          done
          popd
          cp -af "$doc_path/." "$site/"
          rm -rf "$site/$doc_tag_path"
          mkdir -p "$site/$doc_tag_path"
          cp -af "$doc_path/." "$site/$doc_tag_path/"
        elif [[ "${{ github.event_name }}" == "push" ]]; then
          pushd "$site"
          roots=$(find . -mindepth 2 -type f -name objects.inv -exec dirname {} \; | cut -d/ -f2 | sort -u)
          for entry in * .[^.]* ..?*; do
            [ -e "$entry" ] || continue
            keep=0
            for r in $roots; do
              [ "$entry" = "$r" ] && keep=1 && break
            done
            [ $keep -eq 0 ] && rm -rf "$entry"
          done
          popd
          cp -af "$doc_path/." "$site/"
        fi

        # Remove stale pull/<id> docs listed in simple tags.json.
        [[ -f "$site/tags.json" ]] || exit 0
        jq -e 'type == "array"' "$site/tags.json" || exit 0 # Skip fine grained

        owner_repository="${{ github.repository }}"
        while IFS= read -r tag; do
          [[ "$tag" =~ ^pull/([0-9]+)$ ]] || continue
          pr_number="${BASH_REMATCH[1]}"
          resp=$(curl -sSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$owner_repository/pulls/$pr_number")
          state=$(echo "$resp" | jq -r '.state // empty')
          if [[ "$state" != "open" ]]; then
            echo "Clean-up $tag"
            [[ -d "$site/$tag" ]] && rm -r "$site/$tag" || :
          fi
        done < <(jq -r '.[] | select(type == "string")' "$site/tags.json")

    - name: Generate sitemap
      if: ${{ steps.lock.outputs.acquired == 'true' }}
      shell: bash
      env:
        site: ${{ steps.download.outputs.site }}
        site_old: ${{ steps.download.outputs.site_old }}
      run: |
        # Generate sitemap
        [[ "${{ runner.debug }}" == "1" ]] && set -x

        baseurl="https://$(echo ${{ github.repository }} | sed 's#/#.github.io/#')"
        today=$(date -u +%F)

        declare -A lastmod=()
        if [[ -f "$site_old/sitemap.xml" ]]; then
          while IFS='|' read -r loc modified; do
            lastmod["/$loc"]="$modified"
          done < <(sed 's#</url>#</url>\n#g' "$site_old/sitemap.xml" |
                   sed -n "s#^.*<loc>${baseurl}/\([^<]*\)</loc><lastmod>\([^<]*\)</lastmod>.*#\1|\2#p")
        fi

        {
          echo "<?xml version='1.0' encoding='utf-8'?>"
          echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
          while IFS= read -r -d '' file; do
            rel=${file#"$site"/}
            loc=$rel
            [[ "$rel" == index.html || "$rel" == */index.html ]] && loc=${rel%index.html}
            modified=$today
            if cmp -s "$site_old/$rel" "$file"; then
              modified=${lastmod["/$loc"]:-$today}
            fi
            printf '<url><loc>%s/%s</loc><lastmod>%s</lastmod></url>\n' \
              "$baseurl" "$loc" "$modified"
          done < <(find "$site" -type f -name '*.html' -print0 | sort -z)
          echo '</urlset>'
        } > "$site/sitemap.xml"

    - name: Generate aux files
      if: ${{ steps.lock.outputs.acquired == 'true' }}
      shell: bash
      env:
        site: ${{ steps.download.outputs.site }}
        doc_tag_path: ${{ steps.context.outputs.doc_tag_path }}
      run: |
        # Generate aux files
        cd "$site"
        touch .nojekyll
        find . -name objects.inv -exec sh -c 'dirname {}' ';' |
          cut -c 3- | sort -Vr |
          jq --raw-input . |
          jq --slurp . > tags.json

        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          echo "LAST_DEPLOY=\"./$doc_tag_path\"" > "$site/context.txt"
        elif [[ "${{ inputs.new_tag }}" == "true" && -n "${{ inputs.tag }}" ]]; then
          echo "LAST_DEPLOY=\". ./$doc_tag_path\"" > "$site/context.txt"
        else
          echo 'LAST_DEPLOY="."' > "$site/context.txt"
        fi

    - name: Pack artifact
      if: ${{ steps.lock.outputs.acquired == 'true' }}
      shell: bash
      env:
        site: ${{ steps.download.outputs.site }}
        worktree: ${{ steps.download.outputs.worktree }}
      run: |
        # Pack artifact
        [[ "${{ runner.debug }}" == "1" ]] && set -x
        rm -f github-pages
        tar -cf "$worktree/artifact.tar" -C "$site" .

        pushd "$worktree"
        git lfs install --local
        printf 'github-pages.zip filter=lfs diff=lfs merge=lfs -text\n' > .gitattributes
        git add .gitattributes
        rm -f github-pages.zip
        zip github-pages.zip artifact.tar
        rm -f artifact.tar
        git add github-pages.zip
        context=""
        msg=""
        action="${{ github.event.action }}"
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          context=" #${{ github.event.number }}"
          owner=$(echo ${{ github.repository }} | cut -d/ -f1)
          repo=$(echo ${{ github.repository }} | cut -d/ -f2)
          msg="${msg}https://$owner.github.io/$repo/pull/${{ github.event.number }}"$'\n'
        fi
        [[ -n "$action" ]] && context="$context ($action)"
        git commit -m "deploy: ${GITHUB_SHA}$context" -m "$msg" --allow-empty
        git push origin HEAD:gh-pages-archive

        popd
        cp "$worktree/github-pages.zip" github-pages

        git worktree remove "$worktree" --force || :
        git worktree prune || :

    - name: Release deploy lock
      if: ${{ steps.lock.outputs.acquired == 'true' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        # Release deploy lock
        owner_repo="${{ github.repository }}"
        lock_name="gh-pages"
        ref="refs/locks/$lock_name"
        resp=$(curl -sSL -w '\n%{http_code}' -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$owner_repo/git/$ref")
        code=$(echo "$resp" | tail -n1)
        [[ "$code" == 204 ]] || { echo "::error:: Failed to release lock: $resp"; exit 1 ;}

    - uses: actions/upload-artifact@v7
      if: ${{ steps.lock.outputs.acquired == 'true' }}
      with:
        path: github-pages
        archive: false
